name: ipaletitas

services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ipaletitas
      POSTGRES_USER: ipaletitas
      POSTGRES_PASSWORD: ipaletitas-local
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ipaletitas -d ipaletitas"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://ipaletitas:ipaletitas-local@database:5432/ipaletitas
      JWT_SECRET: ${JWT_SECRET:-ipaletitas-docker-desarrollo-local}
      API_PUERTO: "8788"
      API_ORIGENES: http://localhost:${APP_PORT:-8788},http://127.0.0.1:${APP_PORT:-8788}
      FRONTEND_URL: http://localhost:${APP_PORT:-8788}
    ports:
      - "127.0.0.1:${APP_PORT:-8788}:8788"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/salud').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
